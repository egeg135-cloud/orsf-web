  <!-- Top Rim Cap -->
  <ellipse cx="16" cy="6" rx="5.5" ry="1.6" fill="#b9e86c"/>
  <ellipse cx="16" cy="5.8" rx="4" ry="1" fill="#e2ff9e" opacity="0.9"/>

  <!-- Translucent Light Sheen -->
